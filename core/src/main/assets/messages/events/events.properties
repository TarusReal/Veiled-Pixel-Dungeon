###choice events (Wahlfreie Ereignisse)
###text layout per event: <key>.title, <key>.text<stage>, <key>.choice<stage>_<n>,
###<key>.result<stage>_<n>, plus free-form log lines for effects

events.ui.continue=Continue
events.ui.silent=The spirit has nothing to offer you right now.

###region 1-5
events.bloodaltar.title=THE BLOODY ALTAR
events.bloodaltar.text0=Ah... a living soul. Who am I? It doesn't matter... Well then, let me propose a deal to you. You see, this altar has been thirsting for so long.\n\n But it will repay you. _A little of your life_, in exchange for a _powerful spell_. The choice is yours, adventurer. _Will you feed it_?
events.bloodaltar.choice0_1=Offer blood: _-5% max HP_ (permanent), _Scroll of Upgrade_
events.bloodaltar.choice0_2=Refuse
events.bloodaltar.result0_1=The priest nods slowly as your blood runs into the groove. "We are satisfied. Take what is rightfully yours."
events.bloodaltar.result0_2=The priest inclines his head. "As you wish, the altar is patient."
events.bloodaltar.log=You hear a faint gurgling sound as your blood seeps away. You feel weaker.

###region 1-5
events.goldenbag.title=A PLUMP BAG
events.goldenbag.text0=A bag full of gold lies open in the middle of the room. Far too open.
events.goldenbag.choice0_1=Take the gold (%d) and risk an attack
events.goldenbag.choice0_2=Leave the bag
events.goldenbag.result0_1=You grab the gold. Somewhere in the dark, something stirs.
events.goldenbag.result0_2=You walk on. The bag stays where it is.
events.goldenbag.log=You pocket %d gold.
events.goldenbag.guard=Something stirs in the dark!

###region 1-5, depth 4+
events.twinweapons.title=TWO WEAPONS
events.twinweapons.text0=Two weapons stand in the ground. One of them is cursed, or so the whispers claim.
events.twinweapons.choice0_1=Take the %s (50% cursed)
events.twinweapons.choice0_2=Take the %s (50% cursed)
events.twinweapons.choice0_3=Leave both
events.twinweapons.result0_1=The sword is yours now. Whether it loves you, you will find out.
events.twinweapons.result0_2=The mace is yours now. Its weight feels honest.
events.twinweapons.result0_3=You leave both weapons in the ground.
events.twinweapons.log=You take the weapon.

###regions 1-3, depth 6+
events.blackwell.title=THE BLACK WELL
events.blackwell.text0=Black water stands still in the well. Your reflection blinks first.
events.blackwell.choice0_1=Drink (50% blessing, otherwise weakness)
events.blackwell.choice0_2=Walk on
events.blackwell.result0_1=You drink. The water tastes of iron and regret.
events.blackwell.result0_2=You leave the well behind.
events.blackwell.bless=Something warm spreads through your limbs.
events.blackwell.curse=Your knees buckle. The water had a price after all.

###region 1-5, 40 gold+
events.trader.title=THE WANDERING TRADER
events.trader.text0=A hooded figure spreads out a blanket. Only scrolls, no questions.
events.trader.choice0_1=Buy: 40 gold for a scroll
events.trader.choice0_2=Walk on
events.trader.result0_1=The trader nods and hands you a scroll. Your gold vanishes into their sleeves.
events.trader.result0_2=The trader shrugs and keeps unpacking.
events.trader.log=You hand over 40 gold.

###regions 3-5, depth 11+
events.forge.title=THE FORGOTTEN FORGE
events.forge.text0=An anvil, a forge, still warm. Someone worked here recently.
events.forge.choice0_1=Upgrade your weapon (+1, costs 20% HP)
events.forge.choice0_2=Leave
events.forge.result0_1=The forge flares up. Your weapon feels heavier in your hand afterwards.
events.forge.result0_2=You leave the forge behind.
events.forge.log=The metal sings under your hands.

###region 1-5
events.shrine.title=THE HUNGRY SHRINE
events.shrine.text0=A shrine with a wide open maw. The stone inside is wet.
events.shrine.choice0_1=Offer 10 HP: potion of healing
events.shrine.choice0_2=Pass by
events.shrine.result0_1=The shrine swallows your blood and spits out a potion.
events.shrine.result0_2=The maw of the shrine stays empty.
events.shrine.log=The stone licks its lips.

###regions 1-4
events.mirror.title=THE MIRROR
events.mirror.text0=A tall mirror stands in the room. Your reflection does not move with you.
events.mirror.choice0_1=Look into it
events.mirror.choice0_2=Shatter it (50% gold, otherwise cuts)
events.mirror.text1=Your reflection reaches out. It waits patiently.
events.mirror.choice1_1=Take its hand (50% blessing, otherwise weakness)
events.mirror.choice1_2=Step back
events.mirror.result0_1=The glass clouds over. When it clears, your reflection stands closer.
events.mirror.result0_2=The mirror breaks. Shards lie at your feet.
events.mirror.result1_1=The hand is cold. A shiver runs up your arm.
events.mirror.result1_2=You step back. The reflection lowers its hand.
events.mirror.gold=Something small and valuable rolls out of the frame.
events.mirror.cuts=The shards bite into your fingers.
events.mirror.bless=Your reflection nods, satisfied.
events.mirror.curse=The cold does not leave your bones.

###regions 2-4, depth 6+
events.pact.title=THE FORGOTTEN PACT
events.pact.text0=A voice from the dark offers you power. The price: the merchants of the depths shall grow richer.
events.pact.choice0_1=Accept: potion of strength, shop prices +25%
events.pact.choice0_2=Refuse
events.pact.result0_1=Something nods. A potion appears in your pack.
events.pact.result0_2=The voice falls silent.
events.pact.log=The pact settles over the dungeon like a shadow.

###regions 3-5, depth 11+
events.embercore.title=THE EMBER CORE
events.embercore.text0=A core glows in the wall. Creatures nearby turn their heads towards it.
events.embercore.choice0_1=Take the core: +1 enemy per floor, but a ring
events.embercore.choice0_2=Destroy the core
events.embercore.result0_1=The core burns in your palm. Somewhere far away, something howls.
events.embercore.result0_2=The core shatters. The glow dies.
events.embercore.log=The core hums against your skin.
