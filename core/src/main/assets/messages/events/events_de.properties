###choice events (Wahlfreie Ereignisse)
###text layout per event: <key>.title, <key>.text<stage>, <key>.choice<stage>_<n>,
###<key>.result<stage>_<n>, plus free-form log lines for effects

events.ui.continue=Weiter
events.ui.silent=Der Geist hat dir gerade nichts anzubieten.

###Region 1-5
events.bloodaltar.title=DER BLUTIGE ALTAR
events.bloodaltar.text0=Ah... eine lebendige Seele. Wer ich bin? Das spielt keine Rolle. Aber lass mir dir ein Handel vorschlagen. Der Altar dürstet schon so lange.\n\n Aber er nimmt nicht, ohne zu geben: ein wenig Eures Lebens, für einen mächtigen Zauber. Die Wahl liegt bei Euch, Abenteurer. Wollt Ihr ihn nähren?
events.bloodaltar.choice0_1=Blut opfern: -5% max. TP (dauerhaft), + Schriftrolle der Verbesserung
events.bloodaltar.choice0_2=Ablehnen
events.bloodaltar.result0_1=Der Priester nickt langsam, während dein Blut in die Rille rinnt. „Wir sind zufrieden. Nehmt, was euch zusteht.“
events.bloodaltar.result0_2=Der Priester neigt den Kopf. „Dann wartet der Altar. Er hat Zeit.“
events.bloodaltar.log=Du hörst ein leises Grugeln während dein Blut versickert. Du fühlst dich schwächer.

###Region 1-5
events.goldenbag.title=EIN PRALLER BEUTEL
events.goldenbag.text0=Ein Beutel voller Gold liegt offen im Raum. Zu offen.
events.goldenbag.choice0_1=Nimm das Gold (%d) und riskiere einen Angriff
events.goldenbag.choice0_2=Den Beutel liegen lassen
events.goldenbag.result0_1=Du greifst zu. Irgendwo in der Dunkelheit regt sich etwas.
events.goldenbag.result0_2=Du gehst weiter. Der Beutel bleibt liegen.
events.goldenbag.log=Du steckst %d Gold ein.
events.goldenbag.guard=Etwas rührt sich im Dunkeln!

###Region 1-5, Tiefe 4+
events.twinweapons.title=ZWEI WAFFEN
events.twinweapons.text0=Zwei Waffen stecken im Boden. Eine davon ist verflucht, behauptet zumindest das Flüstern.
events.twinweapons.choice0_1=Schwert nehmen (50% verflucht)
events.twinweapons.choice0_2=Streitkolben nehmen (50% verflucht)
events.twinweapons.choice0_3=Beide liegen lassen
events.twinweapons.result0_1=Das Schwert gehört jetzt dir. Ob es dich mag, wirst du noch merken.
events.twinweapons.result0_2=Der Streitkolben gehört jetzt dir. Sein Gewicht fühlt sich ehrlich an.
events.twinweapons.result0_3=Du lässt beide Waffen im Boden stecken.
events.twinweapons.log=Du nimmst die Waffe.

###Regionen 1-3, Tiefe 6+
events.blackwell.title=DER SCHWARZE BRUNNEN
events.blackwell.text0=Schwarzes Wasser steht still im Brunnen. Dein Spiegelbild blinzelt zuerst.
events.blackwell.choice0_1=Trinken (50% Segen, sonst Schwäche)
events.blackwell.choice0_2=Weitergehen
events.blackwell.result0_1=Du trinkst. Das Wasser schmeckt nach Eisen und Bedauern.
events.blackwell.result0_2=Du lässt den Brunnen hinter dir.
events.blackwell.bless=Etwas Warmes breitet sich in deinen Gliedern aus.
events.blackwell.curse=Deine Knie geben nach. Das Wasser hatte doch einen Preis.

###Region 1-5, ab 40 Gold
events.trader.title=DER WANDERNDE HÄNDLER
events.trader.text0=Eine vermummte Gestalt breitet eine Decke aus. Nur Schriftrollen, keine Fragen.
events.trader.choice0_1=Kaufen: 40 Gold für eine Schriftrolle
events.trader.choice0_2=Weitergehen
events.trader.result0_1=Der Händler nickt und reicht dir eine Rolle. Dein Gold verschwindet in den Ärmeln.
events.trader.result0_2=Der Händler zuckt mit den Schultern und packt weiter aus.
events.trader.log=Du übergibst 40 Gold.

###Regionen 3-5, Tiefe 11+
events.forge.title=DIE VERGESSENE WERKSTATT
events.forge.text0=Ein Amboss, eine Esse, noch warm. Hier hat erst kürzlich jemand gearbeitet.
events.forge.choice0_1=Waffe verstärken (+1, kostet 20% TP)
events.forge.choice0_2=Gehen
events.forge.result0_1=Die Esse flackert auf. Die Waffe liegt danach schwerer in deiner Hand.
events.forge.result0_2=Du lässt die Werkstatt hinter dir.
events.forge.log=Das Metall singt unter deinen Händen.

###Region 1-5
events.shrine.title=DER HUNGRIGE SCHREIN
events.shrine.text0=Ein Schrein mit weit offenem Maul. Der Stein darin ist feucht.
events.shrine.choice0_1=10 TP opfern: Heiltrank
events.shrine.choice0_2=Vorbeigehen
events.shrine.result0_1=Der Schrein schluckt dein Blut und spuckt einen Trank aus.
events.shrine.result0_2=Das Maul des Schreins bleibt leer.
events.shrine.log=Der Stein leckt sich die Lippen über.

###Regionen 1-4
events.mirror.title=DER SPIEGEL
events.mirror.text0=Ein hoher Spiegel steht im Raum. Dein Ebenbild bewegt sich nicht mit.
events.mirror.choice0_1=Hineinsehen
events.mirror.choice0_2=Zerschlagen (50% Gold, sonst Schnittwunden)
events.mirror.text1=Dein Ebenbild streckt die Hand aus. Es wartet geduldig.
events.mirror.choice1_1=Greifen (50% Segen, sonst Schwäche)
events.mirror.choice1_2=Zurückweichen
events.mirror.result0_1=Das Glas wird trüb. Als es klar wird, steht dein Ebenbild näher.
events.mirror.result0_2=Der Spiegel zerbricht. Scherben liegen zu deinen Füßen.
events.mirror.result1_1=Die Hand ist kalt. Ein Zittern fährt durch deinen Arm.
events.mirror.result1_2=Du weichst zurück. Das Ebenbild senkt langsam die Hand.
events.mirror.gold=Etwas Kleines und Wertvolles rollt aus dem Rahmen.
events.mirror.cuts=Die Scherben schneiden in deine Finger.
events.mirror.bless=Dein Ebenbild nickt zufrieden.
events.mirror.curse=Die Kälte weicht nicht aus deinen Knochen.

###Regionen 2-4, Tiefe 6+
events.pact.title=DER VERGESSENE PAKT
events.pact.text0=Eine Stimme aus dem Dunkel bietet dir Macht. Der Preis: Die Händler der Tiefe sollen reicher werden.
events.pact.choice0_1=Pakt annehmen: Trank der Stärke, Händlerpreise +25%
events.pact.choice0_2=Ablehnen
events.pact.result0_1=Etwas nickt. Ein Trank erscheint in deinem Gepäck.
events.pact.result0_2=Die Stimme verstummt.
events.pact.log=Der Pakt legt sich wie ein Schatten über den Dungeon.

###Regionen 3-5, Tiefe 11+
events.embercore.title=DER GLÜHENDE KERN
events.embercore.text0=Ein Kern glüht in der Wand. Kreaturen in der Nähe drehen die Köpfe zu ihm.
events.embercore.choice0_1=Kern nehmen: +1 Gegner pro Ebene, dafür ein Ring
events.embercore.choice0_2=Kern zerstören
events.embercore.result0_1=Der Kern brennt in deiner Handfläche. In der Ferne heult etwas auf.
events.embercore.result0_2=Der Kern zerspringt. Die Glut erlischt.
events.embercore.log=Der Kern summt gegen deine Haut.
