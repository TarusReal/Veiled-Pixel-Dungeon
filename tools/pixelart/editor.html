<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veiled Pixel Art Studio</title>
<style>
  :root { --bg:#1e1e24; --panel:#2a2a33; --accent:#6c8cff; --text:#e6e6ef; --muted:#9a9ab0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
  #toolbar { width:260px; background:var(--panel); padding:10px; display:flex; flex-direction:column; gap:8px; overflow:auto; border-right:1px solid #444; }
  #canvasWrap { flex:1; display:flex; align-items:center; justify-content:center; background:#111; overflow:auto; position:relative; }
  canvas { image-rendering:pixelated; cursor:crosshair; background:#222; }
  h3 { margin:8px 0 4px; font-size:13px; color:var(--muted); text-transform:uppercase; }
  button { background:#3a3a46; color:var(--text); border:1px solid #555; padding:6px 8px; border-radius:4px; cursor:pointer; font-size:13px; }
  button:hover { background:#4a4a58; }
  button.active { background:var(--accent); border-color:var(--accent); }
  select, input[type=number], input[type=text] { width:100%; padding:4px; background:#3a3a46; color:var(--text); border:1px solid #555; border-radius:4px; }
  .row { display:flex; gap:6px; }
  .row > * { flex:1; }
  #status { font-size:12px; color:var(--muted); min-height:14px; }
  #colorPreview { width:40px; height:40px; border:1px solid #555; background:#000; }
  .toolbtn { flex:1; }
  #info { font-size:11px; color:var(--muted); }
  input[type=range] { width:100%; }
  label { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="toolbar">
  <h3>File</h3>
  <div class="row">
    <button id="btnNew">New</button>
    <button id="btnLoad">Load JSON</button>
  </div>
  <div class="row">
    <button id="btnImportPng">Import PNG</button>
    <button id="btnSaveJson">Save JSON</button>
  </div>
  <div class="row">
    <button id="btnExportPng">Export PNG</button>
    <button id="btnPromote">Promote</button>
  </div>
  <input type="file" id="fileInput" accept=".json,.png" style="display:none">

  <h3>Preset</h3>
  <select id="preset"></select>
  <div class="row">
    <div><label>W</label><input type="number" id="inpW" min="1" value="16"></div>
    <div><label>H</label><input type="number" id="inpH" min="1" value="16"></div>
  </div>
  <div class="row">
    <div><label>FW</label><input type="number" id="inpFW" min="1" value="16"></div>
    <div><label>FH</label><input type="number" id="inpFH" min="1" value="16"></div>
  </div>
  <button id="btnApplySize">Apply size</button>

  <h3>Tool</h3>
  <div class="row">
    <button class="toolbtn active" data-tool="pencil">Pencil</button>
    <button class="toolbtn" data-tool="eraser">Eraser</button>
  </div>
  <div class="row">
    <button class="toolbtn" data-tool="eyedropper">Eyedrop</button>
    <button class="toolbtn" data-tool="fill">Fill</button>
  </div>

  <h3>Color</h3>
  <div class="row">
    <input type="color" id="colorHex" value="#ff00ff" style="flex:1;height:32px;">
    <div id="colorPreview"></div>
  </div>
  <label>Alpha <span id="alphaVal">255</span></label>
  <input type="range" id="alphaSlider" min="0" max="255" value="255">

  <h3>View</h3>
  <label>Zoom <span id="zoomVal">8</span>x</label>
  <input type="range" id="zoomSlider" min="1" max="32" value="8">
  <label><input type="checkbox" id="chkGrid" checked> Grid</label>
  <label><input type="checkbox" id="chkFrames" checked> Frame borders</label>

  <h3>Info</h3>
  <div id="info">size: -</div>
  <div id="status"></div>
</div>
<div id="canvasWrap">
  <canvas id="canvas"></canvas>
</div>

<script>
const PRESETS = {
  "tile_16": {w:16,h:16,fw:16,fh:16},
  "tile_80": {w:80,h:80,fw:16,fh:16},
  "tile_128": {w:128,h:128,fw:16,fh:16},
  "tile_256": {w:256,h:256,fw:16,fh:16},
  "mob_strip": {w:12,h:15,fw:12,fh:15},
  "mob_strip_4": {w:48,h:15,fw:12,fh:15},
  "mob_strip_6": {w:72,h:15,fw:12,fh:15},
  "item_icon": {w:16,h:16,fw:16,fh:16},
  "effect_strip": {w:32,h:16,fw:16,fh:16},
  "fx_16": {w:16,h:16,fw:16,fh:16}
};

let img = null; // {name,width,height,frameWidth,frameHeight,mode,pixels:[r,g,b,a,...]}
let tool = "pencil";
let zoom = 8;
let showGrid = true;
let showFrames = true;
let currentColor = [255,0,255,255];
let undoStack = [];
let redoStack = [];
let isDrawing = false;
let strokeStarted = false;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function idx(x,y){ return (y*img.width + x)*4; }

function snapshot(){
  return img.pixels.slice();
}

function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}

function restore(snap){
  img.pixels = snap.slice();
  render();
}

function newImage(name,w,h,fw,fh){
  img = { name:name||"untitled", width:w, height:h, frameWidth:fw||w, frameHeight:fh||h, mode:"rgba",
          pixels:new Array(w*h*4).fill(0) };
  // default transparent
  for(let i=3;i<img.pixels.length;i+=4) img.pixels[i]=0;
  undoStack=[]; redoStack=[];
  updateInfo();
  render();
}

function ensureImage(){
  if(!img){ newImage("untitled",16,16,16,16); }
}

function render(){
  if(!img) return;
  const w=img.width, h=img.height;
  canvas.width = w*zoom;
  canvas.height = h*zoom;
  // draw pixels
  const id = ctx.createImageData(w,h);
  for(let i=0;i<img.pixels.length;i++) id.data[i]=img.pixels[i];
  // put at zoom via temp canvas
  const tmp = document.createElement('canvas');
  tmp.width=w; tmp.height=h;
  tmp.getContext('2d').putImageData(id,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(tmp,0,0,w*zoom,h*zoom);
  // grid
  if(showGrid){
    ctx.strokeStyle="rgba(255,255,255,0.15)";
    ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<=w;x++){ ctx.moveTo(x*zoom+0.5,0); ctx.lineTo(x*zoom+0.5,h*zoom); }
    for(let y=0;y<=h;y++){ ctx.moveTo(0,y*zoom+0.5); ctx.lineTo(w*zoom,y*zoom+0.5); }
    ctx.stroke();
  }
  // frame borders
  if(showFrames && img.frameWidth && img.frameHeight){
    ctx.strokeStyle="rgba(108,140,255,0.6)";
    ctx.lineWidth=2;
    ctx.beginPath();
    for(let x=img.frameWidth;x<w;x+=img.frameWidth){ ctx.moveTo(x*zoom,0); ctx.lineTo(x*zoom,h*zoom); }
    for(let y=img.frameHeight;y<h;y+=img.frameHeight){ ctx.moveTo(0,y*zoom); ctx.lineTo(w*zoom,y*zoom); }
    ctx.stroke();
  }
}

function canvasToPixel(e){
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX-rect.left)/zoom);
  const y = Math.floor((e.clientY-rect.top)/zoom);
  return {x,y};
}

function setPixel(x,y,color){
  if(x<0||y<0||x>=img.width||y>=img.height) return;
  const i=idx(x,y);
  img.pixels[i]=color[0]; img.pixels[i+1]=color[1]; img.pixels[i+2]=color[2]; img.pixels[i+3]=color[3];
}

function getPixel(x,y){
  const i=idx(x,y);
  return [img.pixels[i],img.pixels[i+1],img.pixels[i+2],img.pixels[i+3]];
}

function floodFill(x,y,color){
  if(x<0||y<0||x>=img.width||y>=img.height) return;
  const target=getPixel(x,y);
  if(target[0]===color[0]&&target[1]===color[1]&&target[2]===color[2]&&target[3]===color[3]) return;
  const stack=[[x,y]];
  while(stack.length){
    const [cx,cy]=stack.pop();
    if(cx<0||cy<0||cx>=img.width||cy>=img.height) continue;
    const cur=getPixel(cx,cy);
    if(!(cur[0]===target[0]&&cur[1]===target[1]&&cur[2]===target[2]&&cur[3]===target[3])) continue;
    setPixel(cx,cy,color);
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
}

function beginStroke(){ if(!strokeStarted){ pushUndo(); strokeStarted=true; } }

function endStroke(){ strokeStarted=false; render(); }

canvas.addEventListener('mousedown', (e)=>{
  ensureImage();
  const {x,y}=canvasToPixel(e);
  if(tool==='pencil'){
    beginStroke(); setPixel(x,y,currentColor); render();
  } else if(tool==='eraser'){
    beginStroke(); setPixel(x,y,[0,0,0,0]); render();
  } else if(tool==='eyedropper'){
    const c=getPixel(x,y);
    currentColor=c.slice();
    syncColorUI();
  } else if(tool==='fill'){
    beginStroke(); floodFill(x,y,currentColor.slice()); render(); endStroke();
  }
  isDrawing=true;
});

canvas.addEventListener('mousemove', (e)=>{
  if(!isDrawing) return;
  const {x,y}=canvasToPixel(e);
  if(tool==='pencil'){ setPixel(x,y,currentColor); render(); }
  else if(tool==='eraser'){ setPixel(x,y,[0,0,0,0]); render(); }
});

window.addEventListener('mouseup', ()=>{ if(isDrawing){ isDrawing=false; if(strokeStarted) endStroke(); } });

// keyboard undo/redo
window.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key==='z' && !e.shiftKey){ e.preventDefault(); if(undoStack.length){ redoStack.push(snapshot()); restore(undoStack.pop()); } }
  if((e.ctrlKey||e.metaKey) && (e.key==='y' || (e.key==='z' && e.shiftKey))){ e.preventDefault(); if(redoStack.length){ undoStack.push(snapshot()); restore(redoStack.pop()); } }
});

function syncColorUI(){
  const hex = '#'+currentColor.slice(0,3).map(v=>v.toString(16).padStart(2,'0')).join('');
  document.getElementById('colorHex').value=hex;
  document.getElementById('alphaSlider').value=currentColor[3];
  document.getElementById('alphaVal').textContent=currentColor[3];
  document.getElementById('colorPreview').style.background=`rgba(${currentColor.join(',')})`;
}

document.getElementById('colorHex').addEventListener('input', (e)=>{
  const hex=e.target.value;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  currentColor=[r,g,b,parseInt(document.getElementById('alphaSlider').value)];
  syncColorUI();
});
document.getElementById('alphaSlider').addEventListener('input', (e)=>{
  currentColor[3]=parseInt(e.target.value);
  document.getElementById('alphaVal').textContent=currentColor[3];
  syncColorUI();
});

document.querySelectorAll('.toolbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.toolbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    tool=b.dataset.tool;
  });
});

document.getElementById('zoomSlider').addEventListener('input', (e)=>{
  zoom=parseInt(e.target.value);
  document.getElementById('zoomVal').textContent=zoom;
  render();
});
document.getElementById('chkGrid').addEventListener('change', (e)=>{ showGrid=e.target.checked; render(); });
document.getElementById('chkFrames').addEventListener('change', (e)=>{ showFrames=e.target.checked; render(); });

function updateInfo(){
  if(!img) return;
  document.getElementById('info').textContent = `size: ${img.width}x${img.height}  frame: ${img.frameWidth}x${img.frameHeight}  name: ${img.name}`;
  document.getElementById('inpW').value=img.width;
  document.getElementById('inpH').value=img.height;
  document.getElementById('inpFW').value=img.frameWidth;
  document.getElementById('inpFH').value=img.frameHeight;
}

function applyPreset(name){
  const p=PRESETS[name];
  if(!p) return;
  document.getElementById('inpW').value=p.w;
  document.getElementById('inpH').value=p.h;
  document.getElementById('inpFW').value=p.fw;
  document.getElementById('inpFH').value=p.fh;
}

const presetSel=document.getElementById('preset');
Object.keys(PRESETS).forEach(k=>{
  const o=document.createElement('option'); o.value=k; o.textContent=k; presetSel.appendChild(o);
});
presetSel.addEventListener('change', ()=>applyPreset(presetSel.value));

document.getElementById('btnApplySize').addEventListener('click', ()=>{
  ensureImage();
  const w=parseInt(document.getElementById('inpW').value);
  const h=parseInt(document.getElementById('inpH').value);
  const fw=parseInt(document.getElementById('inpFW').value);
  const fh=parseInt(document.getElementById('inpFH').value);
  // resize preserving overlap
  const old=img;
  newImage(old.name,w,h,fw,fh);
  for(let y=0;y<Math.min(old.height,h);y++)
    for(let x=0;x<Math.min(old.width,w);x++){
      const i=(y*old.width+x)*4;
      setPixel(x,y,[old.pixels[i],old.pixels[i+1],old.pixels[i+2],old.pixels[i+3]]);
    }
  updateInfo(); render();
});

document.getElementById('btnNew').addEventListener('click', ()=>{
  const name=prompt("Image name (snake_case):","untitled")||"untitled";
  const w=parseInt(document.getElementById('inpW').value);
  const h=parseInt(document.getElementById('inpH').value);
  const fw=parseInt(document.getElementById('inpFW').value);
  const fh=parseInt(document.getElementById('inpFH').value);
  newImage(name,w,h,fw,fh);
});

// file loading
const fileInput=document.getElementById('fileInput');
document.getElementById('btnLoad').addEventListener('click', ()=>{ fileInput.accept=".json"; fileInput.click(); });
document.getElementById('btnImportPng').addEventListener('click', ()=>{ fileInput.accept=".png"; fileInput.click(); });

fileInput.addEventListener('change', async (e)=>{
  const f=e.target.files[0];
  if(!f) return;
  if(f.name.endsWith('.json')){
    const text=await f.text();
    const data=JSON.parse(text);
    let px = data.pixels;
    if(Array.isArray(px) && px.length>0 && Array.isArray(px[0]) && Array.isArray(px[0][0])){
      px = px.flat(2);
    } else if(Array.isArray(px) && px.length>0 && Array.isArray(px[0])){
      // already flat list of [r,g,b,a]
    }
    img = { name:data.name||f.name.replace('.px.json','').replace('.json',''),
            width:data.width, height:data.height,
            frameWidth:data.frameWidth||data.width, frameHeight:data.frameHeight||data.height,
            mode:data.mode||'rgba', pixels:px.slice() };
    // ensure flat array of numbers
    if(Array.isArray(img.pixels[0])){ img.pixels = img.pixels.flat(); }
    undoStack=[]; redoStack=[];
    updateInfo(); render();
    setStatus("loaded "+f.name);
  } else {
    const url=URL.createObjectURL(f);
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
      const cx=c.getContext('2d'); cx.drawImage(im,0,0);
      const id=cx.getImageData(0,0,im.width,im.height);
      const name=f.name.replace('.png','');
      img={ name:name, width:im.width, height:im.height, frameWidth:im.width, frameHeight:im.height,
            mode:'rgba', pixels:Array.from(id.data) };
      undoStack=[]; redoStack=[];
      updateInfo(); render();
      URL.revokeObjectURL(url);
      setStatus("imported "+f.name);
    };
    im.src=url;
  }
  fileInput.value='';
});

function setStatus(msg){ document.getElementById('status').textContent=msg; }

document.getElementById('btnSaveJson').addEventListener('click', ()=>{
  ensureImage();
  const data={ name:img.name, width:img.width, height:img.height,
              frameWidth:img.frameWidth, frameHeight:img.frameHeight, mode:img.mode, pixels:[] };
  for(let y=0;y<img.height;y++){
    for(let x=0;x<img.width;x++){
      const i=(y*img.width+x)*4;
      data.pixels.push([img.pixels[i],img.pixels[i+1],img.pixels[i+2],img.pixels[i+3]]);
    }
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  download(blob, img.name+'.px.json');
});

document.getElementById('btnExportPng').addEventListener('click', ()=>{
  ensureImage();
  // render to temp canvas at 1x
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  const cx=c.getContext('2d');
  const id=cx.createImageData(img.width,img.height);
  for(let i=0;i<img.pixels.length;i++) id.data[i]=img.pixels[i];
  cx.putImageData(id,0,0);
  c.toBlob((blob)=>download(blob, img.name+'.png'),'image/png');
});

function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('btnPromote').addEventListener('click', async ()=>{
  ensureImage();
  // build json + png blobs
  const data={ name:img.name, width:img.width, height:img.height,
              frameWidth:img.frameWidth, frameHeight:img.frameHeight, mode:img.mode, pixels:[] };
  for(let y=0;y<img.height;y++){
    for(let x=0;x<img.width;x++){
      const i=(y*img.width+x)*4;
      data.pixels.push([img.pixels[i],img.pixels[i+1],img.pixels[i+2],img.pixels[i+3]]);
    }
  }
  // validation (basic)
  if(!/^[a-z][a-z0-9_]*$/.test(img.name)){ setStatus("name not snake_case"); return; }
  if(img.width<=0||img.height<=0){ setStatus("invalid size"); return; }
  // File System Access API
  if(window.showDirectoryPicker){
    try{
      const dir=await window.showDirectoryPicker();
      // write json
      const jh=await dir.getFileHandle(img.name+'.px.json',{create:true});
      const jw=await jh.createWritable(); await jw.write(JSON.stringify(data,null,2)); await jw.close();
      // write png
      const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
      const cx=c.getContext('2d');
      const id=cx.createImageData(img.width,img.height);
      for(let i=0;i<img.pixels.length;i++) id.data[i]=img.pixels[i];
      cx.putImageData(id,0,0);
      const blob=await new Promise(res=>c.toBlob(res,'image/png'));
      const ph=await dir.getFileHandle(img.name+'.png',{create:true});
      const pw=await ph.createWritable(); await pw.write(blob); await pw.close();
      setStatus("promoted to "+dir.name);
    }catch(err){
      if(err.name!=='AbortError') setStatus("promote failed: "+err.message);
    }
  } else {
    // fallback: download both
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    download(blob, img.name+'.px.json');
    const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    const cx=c.getContext('2d');
    const id=cx.createImageData(img.width,img.height);
    for(let i=0;i<img.pixels.length;i++) id.data[i]=img.pixels[i];
    cx.putImageData(id,0,0);
    c.toBlob((b)=>download(b, img.name+'.png'),'image/png');
    setStatus("File System Access API unavailable; downloaded both files instead.");
  }
});

syncColorUI();
ensureImage();
setStatus("ready");
</script>
</body>
</html>
